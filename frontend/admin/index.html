<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Smart Attendance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457d6'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Smart Attendance</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="engine-pill" class="engine-pill" role="status"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <h1 id="page-title" class="page-title" tabindex="-1">Dashboard</h1>
        <div class="topbar-right">
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode"></button>
          <div class="user">
            <span id="user-name" class="user-name"></span>
            <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Sign out</button>
          </div>
        </div>
      </header>
      <div id="banner" class="banner-area" role="region" aria-label="System status"></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="login" class="login" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">Smart Attendance needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
